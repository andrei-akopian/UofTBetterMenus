# fly.toml app configuration file for UofT Dining Menu
# Generated for production deployment on Fly.io

app = "uoft-dining-menu"
primary_region = "yyz" # Toronto (closest to UofT campus and ueat.utoronto.ca API)

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 500

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/up"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1

# Optional persistent volume to retain scraped menus and frequency tracking across deploys.
# To provision, run: fly volumes create menu_cache --region yyz --size 1
# If deploying without a persistent volume, you can comment out the [mounts] block below.
[mounts]
  source = "menu_cache"
  destination = "/app/cache"
  initial_size = "1GB"
